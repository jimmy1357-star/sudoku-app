<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modern Sudoku</title>
  
  <!-- PWA Manifest & Mobile Web App Capabilities -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/566/566295.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Controls -->
    <header class="app-header">
      <div class="timer-box">
        <div id="timer" class="timer-display">00:00</div>
        <button id="btn-pause" class="btn btn-icon" title="Pause Game">⏸</button>
      </div>
      <div class="header-controls">
        <select id="difficulty-select" class="select-input">
          <option value="42">Easy</option>
          <option value="34" selected>Medium</option>
          <option value="26">Hard</option>
          <option value="22">Expert</option>
        </select>
        <button id="btn-undo" class="btn">Undo ↩</button>
        <button id="btn-new-game" class="btn btn-primary">New Game</button>
        <button id="btn-settings" class="btn btn-icon" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Main Game Board Container -->
    <main class="game-area">
      <div id="sudoku-container" class="sudoku-container">
        <svg id="svg-overlay" class="svg-overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="sudoku-board" class="sudoku-board"></div>
        
        <!-- Pause Screen Overlay -->
        <div id="pause-overlay" class="pause-overlay hidden">
          <div class="pause-card">
            <span>GAME PAUSED</span>
            <button id="btn-resume" class="btn btn-primary">Resume ▶</button>
          </div>
        </div>
      </div>

      <!-- Mode Selector Toolbar -->
      <div class="mode-bar">
        <button id="btn-mode-digit" class="mode-btn active">Digit</button>
        <button id="btn-mode-pencil" class="mode-btn">Pencil ✏️</button>
        <button id="btn-mode-color" class="mode-btn">Color 🎨</button>
      </div>

      <!-- Extended Color Palette -->
      <div id="color-palette" class="color-palette hidden">
        <button class="color-swatch c-blue active" data-color="c-blue"></button>
        <button class="color-swatch c-green" data-color="c-green"></button>
        <button class="color-swatch c-yellow" data-color="c-yellow"></button>
        <button class="color-swatch c-purple" data-color="c-purple"></button>
        <button class="color-swatch c-red" data-color="c-red"></button>
        <button class="color-swatch c-orange" data-color="c-orange"></button>
        <button class="color-swatch c-pink" data-color="c-pink"></button>
        <button class="color-swatch c-clear" data-color="clear">✕</button>
      </div>

      <!-- Touch Numpad with Remaining Counts Badges -->
      <div id="numpad" class="numpad">
        <button class="num-btn" data-value="1">1<span class="digit-count"></span></button>
        <button class="num-btn" data-value="2">2<span class="digit-count"></span></button>
        <button class="num-btn" data-value="3">3<span class="digit-count"></span></button>
        <button class="num-btn" data-value="4">4<span class="digit-count"></span></button>
        <button class="num-btn" data-value="5">5<span class="digit-count"></span></button>
        <button class="num-btn" data-value="6">6<span class="digit-count"></span></button>
        <button class="num-btn" data-value="7">7<span class="digit-count"></span></button>
        <button class="num-btn" data-value="8">8<span class="digit-count"></span></button>
        <button class="num-btn" data-value="9">9<span class="digit-count"></span></button>
        <button id="btn-erase" class="num-btn btn-erase-slot" data-value="0">⌫</button>
      </div>
    </main>
  </div>

  <!-- Settings Overlay Modal -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="btn-close-settings" class="btn-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <span class="setting-label">Dark Mode</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-dark-mode" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Sound Effects</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-sound" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Auto-erase Pencil Notes</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-auto-erase" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Remaining Number Counts</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-digit-counts" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Highlight Errors</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-highlight-errors">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered:', reg.scope))
          .catch((err) => console.error('Service Worker Registration Failed:', err));
      });
    }
  </script>

  <script src="app.js"></script>
</body>
</html>
